# PostgreSQL Configuration for ML Training - High Performance
# Optimized for millions of reads/writes and bulk operations

# MEMORY SETTINGS
shared_buffers = 2GB                    # 25% of RAM (assuming 8GB available)
effective_cache_size = 6GB              # 75% of RAM
work_mem = 64MB                         # For sorting/hashing operations
maintenance_work_mem = 512MB            # For VACUUM, CREATE INDEX

# WRITE AHEAD LOG (WAL)
wal_buffers = 16MB
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
wal_compression = on

# QUERY PLANNING
random_page_cost = 1.1                  # SSD optimization (default 4.0 for HDD)
effective_io_concurrency = 200          # SSD can handle many concurrent I/O
default_statistics_target = 100

# PARALLELIZATION
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# CONNECTION SETTINGS
listen_addresses = '*'                  # Listen on all interfaces (required for Docker)
max_connections = 100
shared_preload_libraries = 'pg_stat_statements'

# AUTOVACUUM - Critical for high write loads
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 10s
autovacuum_vacuum_threshold = 1000
autovacuum_analyze_threshold = 1000
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# LOGGING
log_min_duration_statement = 1000       # Log queries slower than 1s
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on

# PERFORMANCE
synchronous_commit = off                # Faster writes (small risk of data loss on crash)
full_page_writes = on
commit_delay = 100                      # Microseconds
commit_siblings = 5

# BULK OPERATIONS
temp_buffers = 32MB
