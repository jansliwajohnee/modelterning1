version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mlp
    environment:
      POSTGRES_DB: mltraining
      POSTGRES_USER: johnee
      POSTGRES_PASSWORD: johneepass
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "22432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - ml-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U johnee -d mltraining"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlb
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mltraining
      SPRING_DATASOURCE_USERNAME: johnee
      SPRING_DATASOURCE_PASSWORD: johneepass
      ML_TRAINING_DATA_PATH: /app/ml-data
      JAVA_OPTS: "-Xms8g -Xmx10g -XX:+UseG1GC -XX:InitiatingHeapOccupancyPercent=75 -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication"
    ports:
      - "8090:8090"
    volumes:
      - app_logs:/app/logs
      - ml_training_data:/app/ml-data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ml-network
    deploy:
      resources:
        limits:
          memory: 10g
        reservations:
          memory: 8g
    restart: unless-stopped

networks:
  ml-network:
    driver: bridge

volumes:
  postgres_data:
  app_logs:
  ml_training_data:
